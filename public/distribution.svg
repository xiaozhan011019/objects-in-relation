  <title id="title">Coding taxonomy for two-entity mixed-reality interactions</title><rect width="1200" height="300" rx="24" fill="#f8f9ff"/>
  <g font-family="monospace" text-anchor="middle">
    <rect x="25" y="72" width="270" height="156" rx="20" fill="#eaf7f4" stroke="#8bbeb7" stroke-width="3"/><text x="160" y="132" font-size="20" font-weight="700" fill="#315e59">ENTITY RESOURCES</text><text x="160" y="170" font-size="15" fill="#477a74">2 dimensions</text>

    <rect x="612" y="72" width="270" height="156" rx="20" fill="#f8eef5" stroke="#d893cc" stroke-width="3"/><text x="747" y="132" font-size="20" font-weight="700" fill="#754267">INTERACTION DYNAMICS</text><text x="747" y="170" font-size="15" fill="#98538f">2 dimensions</text>
